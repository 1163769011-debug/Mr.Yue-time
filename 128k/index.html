<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="128K计数账本">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<title>Mr.Yue · 128K计数账本</title>
<style>
:root{--blue:#2f6fed;--blue2:#5b8cff;--bg:#f6f8fc;--card:#fff;--text:#18212f;--muted:#7a8494;--border:#e5eaf1;--soft:#eef4ff;--danger:#c73a3a}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f7f9fc 0,#f3f6fb 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:720px;margin:auto;padding:20px 14px 110px}
.brand{margin:4px 4px 18px}
.title{font-size:28px;font-weight:850;letter-spacing:-.6px}
.sub{font-size:13px;color:var(--muted);margin-top:5px}
.card{background:rgba(255,255,255,.98);border:1px solid var(--border);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 30px rgba(23,43,77,.035)}
.datebar{display:grid;grid-template-columns:46px 1fr 58px 46px;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:13px;min-height:44px;font-size:14px;font-weight:700}
.date{font-size:16px;font-weight:800;text-align:center;padding:10px 8px;border-radius:13px;cursor:pointer}
.date:active{background:var(--soft)}
.hero{padding:22px 18px}
.label{font-size:13px;color:var(--muted)}
.amount{font-size:44px;line-height:1.08;font-weight:900;letter-spacing:-1.5px;margin-top:8px}
.amount small{font-size:15px;font-weight:700;color:var(--muted);margin-left:5px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.meta>div{border:1px solid var(--border);border-radius:15px;padding:13px;background:#fbfcfe}
.meta small{color:var(--muted);display:block;font-size:12px}
.meta strong{display:block;font-size:22px;margin-top:4px}
.formula{margin-top:14px;font-size:13px;color:var(--muted);background:#f8fafc;padding:10px 12px;border-radius:12px}
.addWrap{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.add{border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border-radius:16px;min-height:66px;font-size:24px;font-weight:900;box-shadow:0 10px 24px rgba(47,111,237,.22)}
.undo{min-width:92px;border:1px solid var(--border);background:#fff;border-radius:16px;font-weight:750;color:var(--muted)}
.sectionTitle{font-size:18px;font-weight:850}
.sectionSub{font-size:12px;color:var(--muted);margin-top:4px}
.records{margin-top:12px}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-top:1px solid #eef2f6}
.row:first-child{border-top:0}
.num{width:46px;height:46px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:900}
.main{min-width:0}
.result{font-size:16px;font-weight:820}
.calc{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:13px;color:#4f5b6b;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:18px 0}
.note{font-size:13px;line-height:1.7;color:var(--muted)}
@media(max-width:420px){.app{padding-left:10px;padding-right:10px}.amount{font-size:39px}.datebar{grid-template-columns:42px 1fr 54px 42px}.meta{grid-template-columns:1fr 1fr}.row{grid-template-columns:48px 1fr auto}}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><div class="title">Mr.Yue · 128K计数账本</div><div class="sub">每一次 +1 都留下时间痕迹</div></div>

  <div class="datebar">
    <button class="btn" id="prev">‹</button>
    <div class="date" id="dateText" title="点击选择日期"></div>
    <button class="btn" id="today">今天</button>
    <button class="btn" id="next">›</button>
  </div>
  <input id="jumpDate" type="date" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">

  <section class="card hero">
    <div class="label">当前数值</div>
    <div class="amount"><span id="currentAmount">128,000.00</span><small>元</small></div>
    <div class="meta">
      <div><small>累计点击</small><strong id="count">0</strong></div>
      <div><small>当前除数 n</small><strong id="divisor">—</strong></div>
    </div>
    <div class="formula" id="formula">初始值：128,000 元。第一次点击后：128000 ÷ 1。</div>
    <div class="addWrap">
      <button class="add" id="addBtn">+1</button>
      <button class="undo" id="undoBtn">撤销上次</button>
    </div>
  </section>

  <section class="card">
    <div class="sectionTitle">当天记录</div>
    <div class="sectionSub" id="daySummary">查看所选日期的点击记录和具体时间</div>
    <div class="records" id="records"></div>
  </section>

  <section class="card">
    <div class="sectionTitle">说明</div>
    <div class="note">
      初始值固定为 <b>128,000 元</b>。累计点击次数为 n：第 1 次为 128000 ÷ 1，第 2 次为 128000 ÷ 2，第 3 次为 128000 ÷ 3，以此类推。<br>
      点击记录保存在当前浏览器本机，不上传服务器。
    </div>
  </section>
  <div class="foot">128K Counter · Local Data</div>
</div>

<script>
const BASE=128000;
const KEY='mryue_128k_counter_v1';
let selectedDate=new Date(); selectedDate.setHours(12,0,0,0);

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{events:[]}}catch(e){return{events:[]}}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function cnDate(d){return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d)}
function money(v){return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function timeText(iso){return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(iso))}
function eventDate(iso){const d=new Date(iso);return dateKey(d)}
function normalize(){
  const d=load();
  d.events=(d.events||[]).sort((a,b)=>new Date(a.time)-new Date(b.time));
  d.events.forEach((e,i)=>{e.n=i+1;e.value=BASE/e.n});
  save(d); return d;
}
function renderTop(){
  const d=normalize(), n=d.events.length;
  document.getElementById('count').textContent=n;
  document.getElementById('divisor').textContent=n||'—';
  document.getElementById('currentAmount').textContent=money(n?BASE/n:BASE);
  document.getElementById('formula').textContent=n?('当前：128000 ÷ '+n+' = '+money(BASE/n)+' 元'):'初始值：128,000 元。第一次点击后：128000 ÷ 1。';
}
function renderRecords(){
  document.getElementById('dateText').textContent=cnDate(selectedDate);
  const k=dateKey(selectedDate), d=normalize();
  const items=d.events.filter(e=>eventDate(e.time)===k);
  const box=document.getElementById('records');
  document.getElementById('daySummary').textContent=items.length?('当天共点击 '+items.length+' 次'):'查看所选日期的点击记录和具体时间';
  if(!items.length){box.innerHTML='<div class="empty">这一天暂无点击记录</div>';return}
  box.innerHTML=items.slice().reverse().map(e=>'<div class="row"><div class="num">#'+e.n+'</div><div class="main"><div class="result">'+money(e.value)+' 元</div><div class="calc">128000 ÷ '+e.n+'</div></div><div class="time">'+timeText(e.time)+'</div></div>').join('');
}
function render(){renderTop();renderRecords()}
document.getElementById('addBtn').onclick=()=>{
  const d=load(); const now=new Date();
  d.events=d.events||[]; d.events.push({time:now.toISOString()}); save(d);
  selectedDate=new Date();selectedDate.setHours(12,0,0,0);render();
};
document.getElementById('undoBtn').onclick=()=>{
  const d=load(); if(!(d.events||[]).length)return;
  if(confirm('撤销最近一次 +1 记录？')){d.events.pop();save(d);render()}
};
document.getElementById('prev').onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);renderRecords()};
document.getElementById('next').onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);renderRecords()};
document.getElementById('today').onclick=()=>{selectedDate=new Date();selectedDate.setHours(12,0,0,0);renderRecords()};
const jump=document.getElementById('jumpDate');
document.getElementById('dateText').onclick=()=>{jump.value=dateKey(selectedDate);if(jump.showPicker)jump.showPicker();else jump.click()};
jump.onchange=e=>{if(e.target.value){selectedDate=new Date(e.target.value+'T12:00:00');renderRecords()}};
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
